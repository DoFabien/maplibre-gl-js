name: MLT performance

on:
    schedule:
        - cron: "17 2 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: mlt-performance-${{ github.ref }}
    cancel-in-progress: true

jobs:
    benchmark:
        name: Isolated MLT performance budgets
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
              with:
                  node-version-file: ".nvmrc"
                  cache: npm
            - run: npm ci
            - name: Run isolated MLT benchmark matrix
              run: npm run bench:mlt-isolated -- --iterations 30 --warmup 10 --output test/bench/results/mlt-${{ github.sha }}.json
            - name: Check normalized time, memory, and materialization budgets
              run: npm run bench:mlt-check -- --report test/bench/results/mlt-${{ github.sha }}.json
            - name: Archive MLT benchmark report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: mlt-performance-${{ github.sha }}
                  path: test/bench/results/mlt-${{ github.sha }}.json
                  retention-days: 30
